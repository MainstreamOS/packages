name: Build [mainstream] repo

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"   # weekly (Mon 06:00 UTC) — pick up -git package updates
  push:
    branches: [master, main]
    paths:
      - packages.list
      - build-repo.sh
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write          # publish the release assets

concurrency:
  group: build-mainstream-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tooling + enable multilib
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm git gnupg github-cli rsync openssh python
          # curl's stock retry list covers timeouts and 5xx but not
          # protocol-level faults, so a server that corrupts an HTTP/2 stream
          # mid-download fails the package on the first try. retry-all-errors
          # lets makepkg's source downloads shrug off transient server faults.
          cat > /etc/makepkg.conf.d/retry-downloads.conf <<'DLEOF'
          DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
                    'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
                    'http::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 --retry-all-errors -o %o %u'
                    'https::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 --retry-all-errors -o %o %u'
                    'rsync::/usr/bin/rsync --no-motd -z %u %o'
                    'scp::/usr/bin/scp -C %u %o')
          DLEOF

      - uses: actions/checkout@v6

      - name: Create build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -d -m700 -o builder -g builder /home/builder/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | runuser -u builder -- gpg --batch --import
          # Trust our own key so makepkg --sign doesn't prompt.
          runuser -u builder -- bash -c \
            "gpg --batch --command-fd 0 --edit-key '${{ secrets.GPG_KEY_ID }}' trust quit <<<'5
            y'"

      - name: Snapshot published package filenames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runuser -u builder -- env GH_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            python scripts/repo_safety.py snapshot "$GITHUB_WORKSPACE/published-assets.json"

      - name: Build signed repo
        id: build
        run: |
          # The script leaves a package that would not build out of the repo
          # rather than abandoning the run, and names the misses on its last
          # line. Carry that forward so publishing can go ahead and the job can
          # still be failed at the end.
          set -o pipefail
          runuser -u builder -- env GPGKEY="${{ secrets.GPG_KEY_ID }}" \
            CI=true PUBLISHED_ASSETS="$GITHUB_WORKSPACE/published-assets.json" \
            bash "$GITHUB_WORKSPACE/build-repo.sh" 2>&1 | tee build.log
          # awk rather than grep: with pipefail on, a grep that matches nothing
          # fails the assignment, and matching nothing is the good case here.
          misses=$(awk '/^failures: /{sub(/^failures: /, ""); last=$0} END{print last}' build.log)
          echo "failed_pkgs=$misses" >> "$GITHUB_OUTPUT"

      - name: Publish release safely
        # Packages/signatures are immutable. The publisher checks every
        # collision and upload before replacing the database, and retains
        # superseded builds for 30 days after they leave that database.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runuser -u builder -- env GH_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            python scripts/repo_safety.py publish "$GITHUB_WORKSPACE/out"

      - name: Set up the SourceForge key
        # Absolute paths throughout: in a container job HOME is /github/home
        # while ssh resolves ~ from the passwd entry, and ssh does not expand a
        # $HOME that reaches it inside quotes.
        env:
          SF_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 /tmp/sf
          printf '%s\n' "$SF_KEY" > /tmp/sf/key
          chmod 600 /tmp/sf/key
          # Pinned rather than accepted on sight: a mirror fetched over a
          # trusted-on-first-use connection is a mirror anyone can stand in for.
          printf '%s\n' 'frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC' > /tmp/sf/known_hosts
          chmod 600 /tmp/sf/known_hosts

      - name: Mirror the repo to SourceForge
        # Keep old payloads for clients using cached mirror databases. A
        # conflicting filename or failed transfer leaves mirror metadata alone.
        continue-on-error: true
        run: bash scripts/mirror-repo.sh out

      - name: Fail the run for any package that did not build
        # Last, so the verified repo is published before
        # the run goes red. The packages that did build are already out; this
        # exists so a miss is never quietly absorbed.
        if: steps.build.outputs.failed_pkgs != ''
        run: |
          echo "::error title=Packages did not build::${{ steps.build.outputs.failed_pkgs }}"
          echo "### Packages that did not build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.failed_pkgs }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "The repo was published without them; the release keeps whatever copy it already had." >> "$GITHUB_STEP_SUMMARY"
          exit 1
