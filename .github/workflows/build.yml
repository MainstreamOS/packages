name: Build [mainstream] repo

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"   # weekly (Mon 06:00 UTC) — pick up -git package updates
  push:
    branches: [master, main]
    paths:
      - packages.list
      - build-repo.sh
      - .github/workflows/build.yml

permissions:
  contents: write          # publish the release assets

concurrency:
  group: build-mainstream-repo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tooling + enable multilib
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm git gnupg github-cli

      - uses: actions/checkout@v6

      - name: Create build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -d -m700 -o builder -g builder /home/builder/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | runuser -u builder -- gpg --batch --import
          # Trust our own key so makepkg --sign doesn't prompt.
          runuser -u builder -- bash -c \
            "gpg --batch --command-fd 0 --edit-key '${{ secrets.GPG_KEY_ID }}' trust quit <<<'5
            y'"

      - name: Build signed repo
        id: build
        run: |
          # The script leaves a package that would not build out of the repo
          # rather than abandoning the run, and names the misses on its last
          # line. Carry that forward so publishing can go ahead and the job can
          # still be failed at the end.
          set -o pipefail
          runuser -u builder -- env GPGKEY="${{ secrets.GPG_KEY_ID }}" \
            bash "$GITHUB_WORKSPACE/build-repo.sh" 2>&1 | tee build.log
          # awk rather than grep: with pipefail on, a grep that matches nothing
          # fails the assignment, and matching nothing is the good case here.
          misses=$(awk '/^failures: /{sub(/^failures: /, ""); last=$0} END{print last}' build.log)
          echo "failed_pkgs=$misses" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mainstream-repo
          name: "[mainstream] pacman repo"
          body: "Signed [mainstream] pacman repo. Consumed by the dots-hyprland installer and archiso. Built from packages.list."
          files: |
            out/mainstream.db
            out/mainstream.db.sig
            out/mainstream.files
            out/*.pkg.tar.zst
            out/*.pkg.tar.zst.sig

      - name: Prune stale release assets
        # Only when everything built. Pruning compares the release against out/,
        # and a package that failed is missing from out/ — so pruning after a
        # failure would delete the copy already on the release and leave users
        # with no package at all, which is worse than the older one they have.
        if: steps.build.outputs.failed_pkgs == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish only adds/overwrites; delete anything on the release this
          # build did not produce so it stays a faithful mirror of out/. Runs
          # after publish so the release is never left inconsistent.
          assets=$(gh release view mainstream-repo --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          current=$(ls -1 out/ 2>/dev/null)
          while read -r asset; do
            [ -n "$asset" ] || continue
            if ! grep -qxF "$asset" <<< "$current"; then
              echo "pruning stale asset: $asset"
              gh release delete-asset mainstream-repo "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          done <<< "$assets"

      - name: Fail the run for any package that did not build
        # Last, so the repo is published and pruning has had its chance before
        # the run goes red. The packages that did build are already out; this
        # exists so a miss is never quietly absorbed.
        if: steps.build.outputs.failed_pkgs != ''
        run: |
          echo "::error title=Packages did not build::${{ steps.build.outputs.failed_pkgs }}"
          echo "### Packages that did not build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.failed_pkgs }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "The repo was published without them; the release keeps whatever copy it already had." >> "$GITHUB_STEP_SUMMARY"
          exit 1
