name: Watch for a Qt minor release

# quickshell links Qt's private API, so mainstream-quickshell-git pins the Qt
# minor it was built against. When Arch moves qt6-base to the next minor, every
# user's update stops on that pin until quickshell is rebuilt and published
# with a new pkgrel. A rebuild at the same version reaches nobody who already
# has it, so the weekly build alone does not clear the block.
#
# This opens an issue the day the new minor reaches [extra], and a heads-up
# while it is still in a testing or staging repository.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Arch's Qt with the published quickshell pin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import io, json, os, re, subprocess, tarfile, urllib.request

          repo = os.environ["REPO"]

          def fetch(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return r.read()

          def minor(version):
              m = re.match(r"(\d+)\.(\d+)", version)
              return (int(m.group(1)), int(m.group(2))) if m else None

          db = fetch(f"https://github.com/{repo}/releases/download/mainstream-repo/mainstream.db")
          bound = None
          with tarfile.open(fileobj=io.BytesIO(db)) as t:
              for member in t.getmembers():
                  if member.name.startswith("mainstream-quickshell-git-") and member.name.endswith("/desc"):
                      desc = t.extractfile(member).read().decode()
                      m = re.search(r"^qt6-base<(\d+\.\d+)$", desc, re.M)
                      if m:
                          bound = minor(m.group(1))
          if not bound:
              print("The published quickshell carries no Qt pin; nothing to watch.")
              raise SystemExit(0)
          print(f"Published quickshell accepts Qt below {bound[0]}.{bound[1]}")

          results = json.loads(fetch("https://archlinux.org/packages/search/json/?name=qt6-base"))["results"]
          found = {r["repo"]: f"{r['pkgver']}-{r['pkgrel']}" for r in results}
          print("Arch qt6-base:", found)

          def open_issue(title, body):
              existing = subprocess.run(["gh", "issue", "list", "--repo", repo, "--state", "open",
                                         "--limit", "200", "--json", "title"],
                                        capture_output=True, text=True, check=True).stdout
              if any(i["title"] == title for i in json.loads(existing)):
                  print(f"Already open: {title}")
                  return
              subprocess.run(["gh", "issue", "create", "--repo", repo, "--title", title, "--body", body], check=True)
              print(f"Opened: {title}")

          steps = (
              "1. In dots-hyprland, bump `pkgrel` in `sdata/dist-arch/mainstream-quickshell-git/PKGBUILD`. "
              "If the pinned `_commit` no longer builds against the new Qt, move it forward too.\n"
              "2. Push dots-hyprland.\n"
              "3. Run the **Build [mainstream] repo** workflow here by hand rather than waiting for Monday.\n"
              "4. Check with `pacman -Si mainstream-quickshell-git` that the new qt6-base range is published."
          )

          stable = found.get("extra")
          if stable and minor(stable) and minor(stable) >= bound:
              open_issue(
                  f"Qt {stable} is in [extra]: rebuild mainstream-quickshell-git",
                  f"Arch's [extra] now has qt6-base {stable}, and the published quickshell only accepts Qt "
                  f"below {bound[0]}.{bound[1]}. **Every user's system update is blocked** until a rebuilt "
                  f"quickshell is published.\n\n{steps}\n\nClose this issue once the rebuild is out.")
              raise SystemExit(0)

          for staging in ("extra-testing", "extra-staging", "kde-unstable"):
              version = found.get(staging)
              if version and minor(version) and minor(version) >= bound:
                  open_issue(
                      f"Qt {minor(version)[0]}.{minor(version)[1]} is on its way ({staging})",
                      f"qt6-base {version} is in [{staging}]. Nothing is blocked yet; this is a heads-up. "
                      f"When it reaches [extra], every user's update will stop on the quickshell pin "
                      f"(below {bound[0]}.{bound[1]}) until a rebuild is published, and a separate issue "
                      f"will open that day.\n\nWhen it lands:\n\n{steps}")
          EOF
